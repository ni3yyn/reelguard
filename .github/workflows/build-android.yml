name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "ReelGuard/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "ReelGuard/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reelguard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ReelGuard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Run unit tests, lint, and debug/release builds
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Prepare directly downloadable APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ReelGuard-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ReelGuard-release-unsigned.apk

      - name: Upload debug APK (direct file, no ZIP)
        uses: actions/upload-artifact@v7
        with:
          path: ReelGuard/app/build/outputs/apk/debug/ReelGuard-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload release APK (unsigned, direct file, no ZIP)
        uses: actions/upload-artifact@v7
        with:
          path: ReelGuard/app/build/outputs/apk/release/ReelGuard-release-unsigned.apk
          archive: false
          if-no-files-found: error
